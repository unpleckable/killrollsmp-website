  <script>
    /*
      Edit this list to add, remove, or update teams. Each member needs a name
      and an image path from the images folder. Team colors accept any CSS color.
    */
    const teams = [
      {
        name: "Blue Diamonds",
        color: "#45ACA5",
        members: [
          { name: "Unpleckable", image: "images/player-mcsolsy.png" },
          { name: "its just logic", image: "images/player-tae.png" },
          { name: "SebB", image: "images/player-killer.png" },
          { name: "OllieF", image: "images/player-sebb.png" }
        ]
      },
      {
        name: "Green Clubs",
        color: "#008000",
        members: [
          { name: "SpiritPenguin", image: "images/player-wyll.png" },
          { name: "ArchieB", image: "images/player-airo.png" },
          { name: "Heinous_paradigm", image: "images/player-archieb.png" },
          { name: "EdmundH", image: "images/player-spirit.png" }
        ]
      },
      {
        name: "Yellow Bolts",
        color: "#FCC01E",
        members: [
          { name: "OwenC", image: "images/player-jj.png" },
          { name: "HarrisonW", image: "images/player-kantje.png" },
          { name: "Pi_Specs", image: "images/player-owenc.png" },
          { name: "BeauH", image: "images/player-harrison.png" }
        ]
      }
    ];

    const teamsContainer = document.querySelector("#teams");

    teams.forEach((team, index) => {
      const card = document.createElement("article");
      card.className = "team-card";
      card.style.setProperty("--team-color", team.color);
      card.innerHTML = `
        <div class="team-number">TEAM ${String(index + 1).padStart(2, "0")}</div>
        <h2>${team.name}</h2>
        <div class="members">
          ${team.members.map((member) => `
            <div class="member">
              <img src="${member.image}" alt="${member.name}" loading="lazy">
              <span>${member.name}</span>
            </div>
          `).join("")}
        </div>
      `;
      teamsContainer.appendChild(card);
    });
  </script>
