    }

    :focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

        animation-duration: .01ms !important;

    .hero-logo {

    h1 {
      margin: .5rem 0 1rem;
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: .9;
      text-transform: uppercase;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .teams {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      align-items: stretch;
      gap: 1.5rem;
    }

    .team-card {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 31rem;
      height: 100%;
      padding: 1.5rem;
      border: 1px solid color-mix(in srgb, var(--team-color) 70%, white 30%);
      border-radius: 1rem;
      background: linear-gradient(145deg, color-mix(in srgb, var(--team-color) 30%, #19172d 70%), rgba(25, 23, 45, .8));
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, .3);
    }

    .team-card::before {
      position: absolute;
      top: -8rem;
      right: -5rem;
      width: 18rem;
      height: 18rem;
      border-radius: 50%;
      background: var(--team-color);
      opacity: .25;
      content: "";
      filter: blur(1rem);
    }

    .team-number {
      position: relative;
      color: var(--team-color);
      font-family: monospace;
      font-weight: 700;
    }

    h2 {
      position: relative;
      display: flex;
      align-items: flex-start;
      min-height: 4.4rem;
      margin: .5rem 0 1.5rem;
      font-family: var(--font-bowlby-one), sans-serif;
      font-size: 2.2rem;
      line-height: 1;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .members {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      align-items: stretch;
      gap: .75rem;
      margin-top: auto;
    }

    .member {
      overflow: hidden;
      border-radius: .5rem;
      background: rgba(0, 0, 0, .28);
    }

    .member img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center 35%;
    }

    .member span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2.8rem;
      padding: .6rem .5rem;
      font-family: var(--font-reddit-mono), monospace;
      font-size: .8rem;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    @media (max-width: 640px) {
      .content {
        padding: 1.5rem 1rem 3rem;
      }

      .mobile-nav {

      .hero p {

      }

  <script>
    /*
      Edit this list to add, remove, or update teams. Each member needs a name
      and an image path from the images folder. Team colors accept any CSS color.
    */
    const teams = [
      {
        name: "Blue Diamonds",
        color: "#45ACA5",
        members: [
          { name: "Unpleckable", image: "images/player-unpleckable.png" },
          { name: "its just logic", image: "images/player-jj.png" },
          { name: "SebB", image: "images/player-mcsolsy.png" },
          { name: "OllieF", image: "images/player-bry.png" }
        ]
      },
      {
        name: "Green Clubs",
        color: "#008000",
        members: [
          { name: "SpiritPenguin", image: "images/player-kantje.png" },
          { name: "ArchieB", image: "images/player-airo.png" },
          { name: "Heinous_paradigm", image: "images/player-jj.png" },
          { name: "EdmundH", image: "images/player-luigi.png" }
        ]
      },
      {
        name: "Yellow Bolts",
        color: "#FCC01E",
        members: [
          { name: "OwenC", image: "images/player-tae.png" },
          { name: "HarrisonW", image: "images/player-wyll.png" },
          { name: "Pi_Specs", image: "images/player-mcsolsy.png" },
          { name: "BeauH", image: "images/player-bry.png" }
        ]
      }
    ];

    const teamsContainer = document.querySelector("#teams");

    teams.forEach((team, index) => {
      const card = document.createElement("article");
      card.className = "team-card";
      card.style.setProperty("--team-color", team.color);
      card.innerHTML = `
        <div class="team-number">TEAM ${String(index + 1).padStart(2, "0")}</div>
        <h2 id="team-${index + 1}-heading">${team.name}</h2>
        <div class="members">
          ${team.members.map((member) => `
            <div class="member">
              <img src="${member.image}" alt="${member.name}" width="400" height="400" loading="lazy"
                onerror="this.onerror=null;this.src='images/logo.png';">
              <span>${member.name}</span>
            </div>
          `).join("")}
        </div>
      `;
      teamsContainer.appendChild(card);
    });

    const equalizeTeamCards = () => {
      const cards = [...document.querySelectorAll(".team-card")];
      cards.forEach((card) => {
        card.style.height = "auto";
      });
      const height = Math.max(...cards.map((card) => card.getBoundingClientRect().height));
      cards.forEach((card) => {
        card.style.height = `${height}px`;
      });
    };

    equalizeTeamCards();
    window.addEventListener("resize", equalizeTeamCards);
    document.querySelectorAll(".member img").forEach((image) => {
      image.addEventListener("load", equalizeTeamCards, { once: true });
    });
  </script>
